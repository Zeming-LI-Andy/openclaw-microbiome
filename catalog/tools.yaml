# Callable surface: session job bootstrap only.
# Analysis CLIs run via the native OpenClaw agent (Bash / conda / docker).
# Step knowledge lives in skills/*/SKILL.md.

tools:
  - id: mgx_create_job
    kind: project
    description: >
      Create or reuse the analysis job for this OpenClaw conversation (one
      sessionId ↔ one job_id). Scaffolds stage/, analysis/, and reproducibility/
      under jobsRoot, bookmarks the job under workspace
      .microbiome/session_jobs/<sessionId>, and returns paths. Call once when
      starting analysis; later calls in the same conversation reuse the same
      job unless force_new is true. Different conversations get different jobs.
    optional: false
    parameters:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Short human label (only used when creating a new job).
        notes:
          type: string
          description: Optional notes stored in job.json when creating.
        force_new:
          type: boolean
          description: >
            If true, mint a new job_id even if this conversation already has one.
            Default false (reuse OPENCLAW_SESSION_JOB_ID or this session's bookmark).
      required: []
