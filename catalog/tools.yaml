# Callable surface: session job bootstrap only.
# Analysis CLIs run via the native OpenClaw agent (Bash / conda / docker).
# Step knowledge lives in skills/*/SKILL.md.

tools:
  - id: mgx_create_job
    kind: project
    description: >
      Create or reuse the analysis job for this OpenClaw conversation (one
      sessionKey ↔ one job_id). Scaffolds stage/, analysis/, and reproducibility/
      under jobsRoot, bookmarks the job under workspace
      .microbiome/session_jobs/<sessionKey>, and returns paths. Call once when
      starting analysis; later calls in the same conversation always reuse the
      same job. Different conversations get different jobs. SessionId rotation
      (rewind / reset) does not mint a new job.
    optional: false
    parameters:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Short human label (only used when creating a new job).
        notes:
          type: string
          description: Optional notes stored in job.json when creating.
      required: []
