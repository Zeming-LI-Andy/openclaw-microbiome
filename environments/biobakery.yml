# Env directory name is biobakery_workflows (runtimes.yaml conda_env).
# Mixes the biobakery channel with conda-forge/bioconda.
# channel_priority: flexible
name: biobakery_workflows
channels:
  - biobakery
  - conda-forge
  - bioconda
dependencies:
  - kneaddata=0.12.4
  - metaphlan=4.2.6
  - humann=3.9
  - bowtie2=2.5.5
