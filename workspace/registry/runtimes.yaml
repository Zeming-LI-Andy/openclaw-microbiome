# Host conda runtimes and allowlisted CLIs / packages for microbiome analysis.
# Agent: Read this file for tools + conda_env. Do not conda install from this file.
# Example: conda run -n <conda_env> --no-capture-output <tool> …
#
# Resolve conda from PATH. Optional:
#   CONDA_EXE, CONDA_ROOT
# Uncomment only for a machine-local pin:
# conda_executable: /opt/conda/bin/conda
# conda_prefix: /opt/conda/envs

runtimes:
  qiime2-amplicon:
    description: QIIME 2 amplicon stack (import, DADA2, taxonomy, phylogeny, diversity, export)
    conda_env: qiime2-amplicon-2024.10
    tools:
      - qiime
      - biom

  picrust2:
    description: PICRUSt2 functional prediction from ASV tables
    conda_env: picrust2
    tools:
      - picrust2_pipeline.py
      - place_seqs.py
      - hsp.py
      - metagenome_pipeline.py
      - pathway_pipeline.py
      - add_descriptions.py

  biobakery:
    description: bioBakery shotgun toolkit (KneadData, MetaPhlAn, HUMAnN)
    conda_env: biobakery_workflows
    tools:
      - kneaddata
      - metaphlan
      - humann
      - bowtie2

  eggnog_mapper:
    description: EggNOG ortholog / functional annotation (eggnog-mapper + Prodigal)
    conda_env: eggnog_mapper
    tools:
      - eggnog-mapper
      - emapper.py
      - prodigal

  rgi:
    description: CARD Resistance Gene Identifier
    conda_env: rgi
    tools:
      - rgi

  bakta:
    description: Rapid bacterial genome annotation (Bakta)
    conda_env: bakta
    tools:
      - bakta
      - bakta_proteins

  gapseq:
    description: Bacterial metabolic pathway prediction and genome-scale model reconstruction
    conda_env: gapseq
    tools:
      - gapseq

  gutsmash:
    description: Anaerobic gut metabolic gene cluster detection (gutSMASH)
    conda_env: gutsmash
    tools:
      - gutsmash
      - python
      - prodigal

  antismash:
    description: Secondary metabolite biosynthetic gene cluster detection (antiSMASH)
    conda_env: antismash
    tools:
      - antismash

  aviary:
    description: Aviary metagenome assembly / binning / recovery workflows
    conda_env: aviary
    tools:
      - aviary

  stats:
    description: Downstream stats and viz (Python + R microbiome stack)
    conda_env: mgx-base
    tools:
      - python
      - python3
      - R
      - Rscript
      - tqdm
      - numpy
      - pandas
      - scipy
      - scikit-bio
      - gseapy
      - matplotlib
      - seaborn
      - dplyr
      - tidyr
      - stringr
      - maaslin3
      - DESeq2
      - phytools
      - clusterProfiler
      - KEGGREST
      - SpiecEasi
      - WGCNA
      - ggplot2
      - pheatmap

  host:
    description: Lightweight host helpers; shares conda env mgx-base with stats
    conda_env: mgx-base
    tools:
      - python
      - python3
      - seqtk
      - samtools
      - pigz
      - lz4
      - jq
      - cd-hit
      - zcat
